# Metadata lives here (not in pyproject [project]) so that the setuptools
# shipped with macOS's Python 3.9 can build it as well as pipx can.
[metadata]
name = TimeTraceAgent
version = attr: timetrace.__version__
description = 刻迹 (TimeTrace) computer-side runner: quota-aware, zero-spend task execution for Claude Code and Codex
long_description = file: README.md
long_description_content_type = text/markdown
author = 刻迹 contributors
author_email = security@atlaspaces.com
url = https://github.com/underestimatedme/TimeTraceAgent
project_urls =
    Source = https://github.com/underestimatedme/TimeTraceAgent
    Issues = https://github.com/underestimatedme/TimeTraceAgent/issues
    Security = https://github.com/underestimatedme/TimeTraceAgent/blob/main/SECURITY.md
license = Apache-2.0
license_files = LICENSE
keywords = claude-code, codex, ai-agent, task-queue, runner
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include =
    timetrace
    timetrace.*

[options.entry_points]
console_scripts =
    timetrace = timetrace.cli:main
    tta = timetrace.cli:main
